spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=my-app
app.jwt.ttl-minutes=15

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.inventory.expiring-soon-days=3

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT:120}

server.error.include-message=always

spring.config.import=optional:file:.env[.properties]

