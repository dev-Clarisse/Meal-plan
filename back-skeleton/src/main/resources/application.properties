spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5433/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JPA / sécurité ---
spring.jpa.open-in-view=false
# Utilisez Flyway ou Liquibase pour gérer le schéma
spring.jpa.hibernate.ddl-auto=validate
# Évite de logger des données personnelles
spring.jpa.show-sql=false

# --- Ne pas divulguer de détails d'erreur ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- JWT (le secret vient d'une variable d'environnement, jamais du dépôt Git) ---
# Génération : openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=my-app
app.jwt.ttl-minutes=15

# --- Premier administrateur (optionnel, à retirer après la 1re exécution) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- HTTPS obligatoire en production ---
# server.ssl.enabled=true

# --- Inventaire : délai configurable pour les alertes ---
app.inventory.expiring-soon-days=3