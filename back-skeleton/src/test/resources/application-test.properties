spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


# --- JWT : secret encodé en Base64 (valide !) ---
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.issuer=my-app-test
app.jwt.ttl-minutes=15

# --- Admin de test (optionnel) ---
app.admin.email=Admin@Admin.com
app.admin.password=AdminAdminAdmin

# --- Debug JPA ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
logging.level.org.hibernate.orm.deprecation=ERROR

# --- Debug Spring context ---
logging.level.org.springframework.beans.factory=DEBUG
logging.level.org.springframework.boot.autoconfigure.orm.jpa=DEBUG