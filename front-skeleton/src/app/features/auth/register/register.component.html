<div class="login-page d-flex align-items-center justify-content-center p-3">
  <div class="card login-card shadow-lg border-0">
    <div class="login-header text-center p-4">
      <div class="logo mb-2">🥕</div>
      <h1 class="h3 fw-bold mb-0">Meal Planner</h1>
      <p class="mb-0 small">Crée ton compte en quelques secondes</p>
    </div>

    <div class="card-body p-4">
      <h2 class="h5 fw-semibold text-mp-green mb-3">Inscription</h2>

      <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control form-control-lg"
                 formControlName="email" placeholder="vous@exemple.com" autocomplete="username"
                 [class.is-invalid]="email.invalid && email.touched" />
          <div class="invalid-feedback">Entre un email valide.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <div class="input-group">
            <input id="password" [type]="showPassword ? 'text' : 'password'"
                   class="form-control form-control-lg" formControlName="password"
                   autocomplete="new-password"
                   [class.is-invalid]="password.invalid && password.touched" />
            <button type="button" class="btn btn-outline-mp"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Masquer' : 'Afficher'">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
            <div class="invalid-feedback">Le mot de passe doit contenir entre 12 et 72 caractères.</div>
          </div>
          <div class="form-text">12 caractères minimum.</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
          <input id="confirmPassword" [type]="showPassword ? 'text' : 'password'"
                 class="form-control form-control-lg" formControlName="confirmPassword"
                 autocomplete="new-password"
                 [class.is-invalid]="confirmPassword.touched && (confirmPassword.invalid || form.hasError('mismatch'))" />
          <div class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
        </div>

        <div class="form-check mb-4">
          <input id="consent" type="checkbox" class="form-check-input" formControlName="consent"
                 [class.is-invalid]="consent.invalid && consent.touched" />
          <label for="consent" class="form-check-label small">
            J'accepte le traitement de mes données personnelles pour la création et la gestion de mon compte.
          </label>
          <div class="invalid-feedback">Le consentement est obligatoire.</div>
        </div>

        <button type="submit" class="btn btn-mp btn-lg w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Création…' : 'Créer mon compte' }}
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        Déjà un compte ? <a routerLink="/login" class="fw-semibold">Se connecter</a>
      </p>
    </div>
  </div>
</div>
