<app-auth-layout title="Bon retour" subtitle="Planifie tes repas, simplifie ta semaine">
<div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control form-control-lg"
            formControlName="email"
            placeholder="vous@exemple.com"
            autocomplete="username"
            [class.is-invalid]="email.invalid && email.touched"
          />
          <div class="invalid-feedback">Entre un email valide.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Mot de passe</label>
          <div class="password-field">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control form-control-lg"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              [class.is-invalid]="password.invalid && password.touched"
            />
            <button type="button" class="toggle" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword" aria-hidden="true"></i>
        </button>
            <div class="invalid-feedback">Mot de passe requis.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-mp btn-lg w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>

      <p class="text-center small mt-4 mb-0">
        Pas encore de compte ? <a routerLink="/register" class="fw-semibold">S'inscrire</a>
      </p>
</app-auth-layout>
