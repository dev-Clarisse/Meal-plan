<div class="stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast"
      [class.error]="toast.kind === 'error'"
      [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
    >
      <i class="bi" [class.bi-check-circle]="toast.kind === 'success'" [class.bi-exclamation-circle]="toast.kind === 'error'" aria-hidden="true"></i>
      <span class="message">{{ toast.message }}</span>
      <button type="button" class="close" aria-label="Fermer" (click)="toastService.dismiss(toast.id)">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
