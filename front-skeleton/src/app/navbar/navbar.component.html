<header class="topbar" [class.on-home]="isHome">
  <a class="brand" routerLink="/">
    <span class="brand-name">Mijoté</span>
  </a>

  <nav class="links">
    @for (link of links; track link.href) {
      <a [routerLink]="link.href" routerLinkActive="active">{{ link.name }}</a>
    }
  </nav>
</header>
